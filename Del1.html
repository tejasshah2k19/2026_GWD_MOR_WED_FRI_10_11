<!DOCTYPE html>
<html>
<head>
    <title>Employee Profile</title>

    <style>

        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            background-color: #263238;
            color: white;

            text-align: center;
            font-family: Georgia, serif;
            font-size: 36px;

            padding: 20px;
            margin: 0 0 40px 0;

            border: 5px solid black;
        }

        div {
            width: 500px;

            background-color: white;

            margin: 0 auto;
            padding: 30px;

            border: 5px solid #263238;

         }

        h2 {
            font-size: 28px;
            color: #263238;

            text-align: center;

            margin: 10px 0 25px 0;
            padding: 15px;

            border-bottom: 3px solid #263238;
        }

        p {
            font-size: 18px;
            line-height: 1.7;

            margin: 10px 0;
            padding: 8px;

            border: 1px solid #aaaaaa;

            background-color: #f5f5f5;
        }

        button {
            display: block;

            margin: 25px auto 10px auto;
            padding: 12px 30px;

            background-color: white;

            font-size: 18px;
            font-weight: bold;

            border: 3px solid #263238;
            border-radius: 8px;
        }

        footer {
            text-align: center;

            margin-top: 40px;
            padding: 15px;

            background-color: #263238;
            color: white;

            border-top: 5px double white;
        }

    </style>
</head>

<body>

    <h1>EMPLOYEE PROFILE</h1>

    <div>

        <h2>Roshan Patel</h2>

        <p>
            <strong>Department:</strong>
            Computer Science
        </p>

        <p>
            <strong>Position:</strong>
            Software Developer
        </p>

        <p>
            <strong>Experience:</strong>
            3 Years
        </p>

        <p>
            <strong>Email:</strong>
            rahul@example.com
        </p>

        <p>
            <strong>Location:</strong>
            Ahmedabad
        </p>

        <button>
            Contact Employee
        </button>

    </div>

    <footer>
        ABC Technologies
    </footer>

</body>
</html>
