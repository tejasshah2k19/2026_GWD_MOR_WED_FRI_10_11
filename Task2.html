<!DOCTYPE html>
<html>
<head>
    <title>College Notice Board</title>

    <style>

        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        h1 {
            background-color: #243b55;
            color: white;
            text-align: center;

            font-family: Georgia, serif;
            font-size: 36px;
            font-weight: bold;

            padding: 20px;
            margin: 0 0 30px 0;
        }

        div {
            background-color: white;
            width: 600px;
            margin: 20px auto;
            padding: 25px;
            border: 2px solid #243b55;
            
        }

        h2 {
            background-color: #dbeafe;
            color: #1e3a5f;
            font-family: Georgia, serif;
            font-size: 26px;
            font-style: italic;
            text-align: center;
            padding: 10px;
        }

        p {
            font-size: 18px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #444444;
        }

        footer {
            background-color: #243b55;
            color: white;
            text-align: center;
            font-size: 16px;
            padding: 15px;
            margin-top: 30px;
        }

        
    </style>
</head>

<body>

    <h1>COLLEGE NOTICE BOARD</h1>
    <div>
        <h2>Important Notice</h2>
        <p>
            All students are informed that the
            internal examination will be conducted
            next week.
        </p>
        <p>
            Students must bring their college ID card
            and examination materials.
        </p>
        <p>
            Date: 25 August 2026
        </p>
        <p>
            Time: 10:00 AM
        </p>
    </div>
    <footer>
        ABC Engineering College
    </footer>
</body>

</html>
