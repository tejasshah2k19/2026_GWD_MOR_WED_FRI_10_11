<!DOCTYPE html>
<html>
<head>

    <style>

        h1 {
            font-size: 40px;
        }

        .small {
            font-size: 12px;
        }

        .normal {
            font-size: 20px;
        }

        .large {
            font-size: 30px;
        }

        .relative {
            font-size: 2em;
        }

        .root {
            font-size: 2rem;
        }

    </style>

</head>

<body>

    <h1>CSS Font Size</h1>

    <p class="small">This is small text.</p>

    <p class="normal">This is normal text.</p>

    <p class="large">This is large text.</p>

    <div style="font-size: 20px;">
        <p class="relative">This is 2em text.</p>
    </div>

    <p class="root">This is 2rem text.</p>

</body>
</html>
