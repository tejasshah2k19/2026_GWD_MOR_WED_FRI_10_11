<!DOCTYPE html>
<html>
<head>

<style>

body {
    font-family: Arial, sans-serif;
}

h1 {
    font-size: 40px;
    font-weight: 700;
    font-style: normal;
}

.normal {
    font-style: normal;
}

.italic {
    font-style: italic;
}

.oblique {
    font-style: oblique;
}

.oblique-angle {
    font-style: oblique 20deg;
}

</style>

</head>

<body>

<h1>CSS Font Style</h1>

<p class="normal">
    This is normal text.
</p>

<p class="italic">
    This is italic text.
</p>

<p class="oblique">
    This is oblique text.
</p>

<p class="oblique-angle">
    This is oblique 20 degree text.
</p>

</body>
</html>
