<!DOCTYPE html>
<html>
<head>

<style>

body {
    font-family: Arial, sans-serif;
}

h1 {
    font-weight: 700;
}

.thin {
    font-weight: 300;
}

.normal {
    font-weight: 400;
}

.medium {
    font-weight: 500;
}

.semibold {
    font-weight: 600;
}

.bold {
    font-weight: 700;
}

.extrabold {
    font-weight: 800;
}

.black {
    font-weight: 900;
}

</style>

</head>

<body>

<h1>Font Weight Demonstration</h1>

<p class="thin">This is weight 300.</p>
<p class="normal">This is weight 400.</p>
<p class="medium">This is weight 500.</p>
<p class="semibold">This is weight 600.</p>
<p class="bold">This is weight 700.</p>
<p class="extrabold">This is weight 800.</p>
<p class="black">This is weight 900.</p>

</body>
</html>
