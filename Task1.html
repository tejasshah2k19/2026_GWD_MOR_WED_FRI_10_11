<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>

         /* Body selector */
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            color: #333333;
            margin: 0;
            padding: 30px;
        }

        /* Main heading */
        h1 {
            background-color: #1e3a5f;
            color: white;
            text-align: center;
            font-size: 36px;
            font-family: Georgia, serif;
            font-weight: bold;
            padding: 20px;
        }

        /* Profile container */
        div {
            background-color: white;
            width: 500px;
            margin: 30px auto;
            padding: 25px;
            text-align: left;

            /* Background properties */
            background-image: url("student-bg.jpg");
            background-repeat: no-repeat;
            background-position: right bottom;
            background-size: 120px;
 
        }

        /* Paragraph selector */
        p {
            font-size: 18px;
            font-family: Arial, sans-serif;
            font-weight: normal;
            line-height: 1.8;
            color: #444444;

            
        }

        /* Heading inside profile */
        h2 {
            font-family: Georgia, serif;
            font-size: 26px;
            font-style: italic;
            color: #1e3a5f;
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>STUDENT PROFILE</h1>

    <div>

        <h2>Student Information</h2>

        <p>Name : Smeet Patel</p>

        <p>Age : 21</p>

        <p>Course : B.Tech Computer Science</p>

        <p>College : ABC Engineering College</p>

        <p>Percentage : 82%</p>

        <h2>About Student</h2>

        <p>
            Smeet is a computer science student interested in
            web development, programming and software engineering.
        </p>

    </div>

</body>
</html>
