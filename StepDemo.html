<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .red{
        background-color: red;
        height: 100px;
        width: 100px;
        border-left-style: double;
        border-left-width: 15px;
        border-left-color: green;

        border-right: double 15px green;
    }

    .blue{
        background-color: blue;
        height: 100px;
        width: 200px;
        margin-left:100px;
        border: dotted 15px red;

    }

    .green{
        background-color: green;
        height: 100px;
        width: 400px;
        margin-left: 300px;
        border-style: solid;
        border-width: 15px;
        border-color: yellow;
        border-radius: 25px;
}
</style>

</head>
<body>
    <div class="red"></div>
    <div class="blue"></div>
    <div class="green"></div>
</body>
</html>
