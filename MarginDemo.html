<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box-green {
            background-color: green;
            height: 100px;
            width: 150px;
            margin-top: 100px;
            margin-left: 100px;
            border-style: solid;
            border-width: 10px;

        }


        .box-orange {
            background-color: orange;
            height: 100px;
            width: 150px;
            margin-top: 100px;
            margin-left: 100px;
            border-style: double;
            border-width: 10px;

        }


        .box-red {
            background-color: red;
            height: 100px;
            width: 150px;
            margin-top: 100px;
            margin-left: 100px;
            /* border-style: solid;
            border-width: 10px;
            border-color: aqua; */
            border: 10px solid aqua;
        }

        .box-yellow {
            background-color: yellow;
            height: 100px;
            width: 150px;
            margin-top: 100px;
            margin-left: 100px;
            border-width: 10px;
            border-color: red;
            border-top-style: dashed;
            border-bottom-style: dashed;
            border-left: none;
        }
    </style>
</head>

<body>


    <div class="box-yellow">

    </div>

    <div class="box-green">
    </div>

    <div class="box-orange">
    </div>

    <div class="box-red">
    </div>

</body>

</html>
