<!DOCTYPE html>
<html>
<head>
    <title>Product Card - Border Properties</title>

    <style>

        /* ---------------- BODY ---------------- */

        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }


        /* ---------------- MAIN HEADING ---------------- */

        h1 {
            background-color: #222222;
            color: white;

            text-align: center;
            font-size: 36px;

            padding: 20px;

            /* Border */
            border: 5px solid black;
        }


        /* ---------------- PRODUCT CARD ---------------- */

        div {
            width: 500px;

            background-color: white;

            margin: 40px auto;
            padding: 25px;

            /* Border properties */

            border-width: 4px;
            border-style: solid;
            border-color: #333333;
        }


        /* ---------------- PRODUCT NAME ---------------- */

        h2 {
            color: #1e3a5f;
            font-size: 28px;

            text-align: center;

            padding: 15px;

            /* Individual border sides */

            border-top-width: 5px;
            border-top-style: solid;
            border-top-color: red;

            border-right-width: 5px;
            border-right-style: dashed;
            border-right-color: blue;

            border-bottom-width: 5px;
            border-bottom-style: double;
            border-bottom-color: green;

            border-left-width: 5px;
            border-left-style: dotted;
            border-left-color: orange;
        }


        /* ---------------- PRODUCT DESCRIPTION ---------------- */

        p {
            font-size: 18px;
            line-height: 1.6;

            padding: 10px;

            /* Different border styles */

            border-style: groove;
            border-width: 6px;
            border-color: purple;
        }


        /* ---------------- PRICE ---------------- */

        h3 {
            font-size: 25px;
            text-align: center;

            padding: 15px;

            color: darkgreen;

            /* Border shorthand */

            border: 3px dashed darkgreen;

            /* Rounded corners */

            border-radius: 15px;
        }


        /* ---------------- BUTTON ---------------- */

        button {
            display: block;

            margin: 20px auto;

            padding: 12px 30px;

            background-color: white;

            font-size: 18px;

            /* Border */

            border-width: 4px;
            border-style: solid;
            border-color: #222222;

            /* Rounded border */

            border-radius: 10px;
        }


        /* ---------------- FOOTER ---------------- */

        footer {
            background-color: #222222;
            color: white;

            text-align: center;

            padding: 15px;

            /* Different border */

            border-top: 6px double white;
        }

    </style>
</head>


<body>

    <h1>PRODUCT STORE</h1>


    <div>

        <h2>Wireless Headphones</h2>

        <p>
            Experience high-quality sound with our
            wireless headphones. They provide excellent
            audio quality, comfortable ear cushions and
            long battery life.
        </p>

        <h3>₹2,499</h3>

        <button>
            Buy Now
        </button>

    </div>


    <footer>
        © 2026 Product Store
    </footer>

</body>
</html>
